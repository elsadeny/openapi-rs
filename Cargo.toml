[package]
name = "openapi-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Protobuf/gRPC trading SDK with symbol-aware lot validation, login, balance, and order flows"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/REPLACE_WITH_YOUR_GITHUB_USERNAME/openapi-rs"
repository = "https://github.com/REPLACE_WITH_YOUR_GITHUB_USERNAME/openapi-rs"
documentation = "https://docs.rs/openapi-rs"
keywords = ["grpc", "protobuf", "trading", "sdk", "rust"]
categories = ["api-bindings", "network-programming"]

[dependencies]
prost = "0.13.5"
rust_decimal = "1.39.0"
thiserror = "2.0.12"
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1.16", features = ["net"] }
tonic = { version = "0.12.3", features = ["transport"] }

[build-dependencies]
prost-build = "0.13.5"
protoc-bin-vendored = "3.1.0"
tonic-build = "0.12.3"
