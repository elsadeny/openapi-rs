[package]
name = "openapi-rs-sdk"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Protobuf/gRPC trading SDK with symbol-aware lot validation, login, balance, order flows, and candle APIs"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/elsadeny/openapi-rs"
repository = "https://github.com/elsadeny/openapi-rs"
documentation = "https://docs.rs/openapi-rs-sdk"
keywords = ["grpc", "protobuf", "trading", "sdk", "rust"]
categories = ["api-bindings", "network-programming"]
exclude = [".DS_Store"]

[lib]
name = "openapi_rs"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.40", default-features = true }
futures-core = "0.3.31"
prost = "0.13.5"
rust_decimal = "1.39.0"
thiserror = "2.0.12"
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1.16", features = ["net"] }
tonic = { version = "0.12.3", features = ["transport"] }

[build-dependencies]
prost-build = "0.13.5"
protoc-bin-vendored = "3.1.0"
tonic-build = "0.12.3"
